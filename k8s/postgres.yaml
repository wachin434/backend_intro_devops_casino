apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "casino"          # Nombre de la base de datos
            - name: POSTGRES_USER
              value: "postgres"        # Usuario
            - name: POSTGRES_PASSWORD
              value: "password123"     # Contraseña (cambiala si tu backend usa otra)
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service              # Este es el DNS interno que usará tu backend
spec:
  type: ClusterIP                     # Nadie desde internet puede entrar aquí
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres